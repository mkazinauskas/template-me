services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host — only `migrate`/`app` need to reach it, over
    # the compose network at `db:5432`. Uncomment if you want to connect from
    # a host tool like `psql`, and change the host-side port if 5432 is
    # already taken locally.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs drizzle-kit push + seeds the static local user, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOCAL_MODE: "true"
        NEXT_PUBLIC_LOCAL_MODE: "true"
        NEXT_PUBLIC_LOCAL_AUTH_EMAIL: "demo@example.com"
        NEXT_PUBLIC_LOCAL_AUTH_PASSWORD: "localpassword123"
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - blob-data:/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  blob-data:
