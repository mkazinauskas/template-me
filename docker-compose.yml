services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host — only `migrate`/`app` need to reach it, over
    # the compose network at `db:5432`. Uncomment if you want to connect from
    # a host tool like `psql`, and change the host-side port if 5432 is
    # already taken locally.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs drizzle-kit push + seeds the static local user, then exits. Reuses
  # the same `dev` image as `app` (it carries drizzle-kit + tsx) with a
  # command override, so `docker compose up --build` only builds one image.
  migrate:
    image: template-me-app
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npx drizzle-kit push --force && npx tsx scripts/seed-local-user.ts"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

  # Runs `next dev` directly (Dockerfile `dev` stage) rather than a
  # production build — this is a dev loop, not a prod-shaped demo. Under
  # `tilt up`, Tilt live-syncs `src`/`public` into the running container and
  # Next's own Turbopack watcher picks up the change; under plain `docker
  # compose up --build` you get the same dev server but have to rebuild
  # manually.
  app:
    image: template-me-app
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - blob-data:/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  blob-data:
